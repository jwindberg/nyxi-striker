# Builds the app on macOS, Windows and Linux for every push and pull request, so a change that
# breaks one platform shows up here. Pushing a tag like v0.2.0 also makes a draft release with the
# installers attached; check it on GitHub, then publish it.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: target/universal-apple-darwin/release/bundle
          - platform: windows-latest
            args: --bundles nsis
            bundle: target/release/bundle
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
            bundle: target/release/bundle
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal Mac app holds both Apple-silicon and Intel builds.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install npm packages
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Check the pages
        if: runner.os == 'Linux'
        working-directory: app
        run: npm run check

      - name: Test nyxi-core
        if: runner.os == 'Linux'
        run: cargo test -p nyxi-core

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          args: ${{ matrix.args }}
          # On a tag, upload the installers to a draft release named after it.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: NYXI Striker ${{ github.ref_name }}
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: nyxi-striker-${{ runner.os }}
          path: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/nsis/*-setup.exe
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/appimage/*.AppImage
          if-no-files-found: error
